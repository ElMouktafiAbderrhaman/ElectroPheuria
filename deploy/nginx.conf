upstream laravel_backend {
    server unix:/var/run/php/php8.3-fpm.sock;
}

server {
    listen 80;
    server_name electropheuria.com www.electropheuria.com;

    # Allow large payloads (base64 images in orders/products)
    client_max_body_size 50M;

    # ─────────────────────────────────────────────────────────────
    # SECTION 1: API REQUESTS → LARAVEL BACKEND
    # ─────────────────────────────────────────────────────────────
    location ^~ /api {
        root /var/www/electropheuria/ElectroPheuria-backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP files (all API routes go through index.php)
    location ~ \.php$ {
        root /var/www/electropheuria/ElectroPheuria-backend/public;

        fastcgi_pass laravel_backend;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;

        # Prevent 504 on slow/large requests (base64 images, DB writes)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # ─────────────────────────────────────────────────────────────
    # SECTION 2: FRONTEND (React SPA)
    # ─────────────────────────────────────────────────────────────
    root /var/www/html;
    index index.html index.htm;

    # SPA routing - send all non-file requests to index.html
    location / {
        # Don't apply this rule to /api
        if ($uri ~* ^/api) {
            # Let it fall through to backend
        }
        
        # Try file, then directory, then SPA index
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────────
    # SECTION 3: STATIC ASSETS (Cache busting)
    # ─────────────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        
        # Try from frontend dist first
        root /var/www/html;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────
    # SECTION 4: SECURITY
    # ─────────────────────────────────────────────────────────────
    
    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        log_not_found off;
    }

    # Block access to sensitive Laravel files
    location ~ ^/(storage|bootstrap|config)/ {
        deny all;
    }

    # Deny access to specific dangerous files
    location ~ ^/(composer|package|env)\.json$ {
        deny all;
    }

    # ─────────────────────────────────────────────────────────────
    # SECTION 5: COMPRESSION & PERFORMANCE
    # ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml;

    # Add security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
