server {
    listen 80;
    server_name electropheuria.com www.electropheuria.com;

    # Frontend (React static files)
    root /var/www/electropheuria/ElectroPheuria-frontend/dist;
    index index.html;

    # API requests -> Laravel
    location /api {
        alias /var/www/electropheuria/ElectroPheuria-backend/public;
        try_files $uri $uri/ @laravel;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/electropheuria/ElectroPheuria-backend/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        }
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/electropheuria/ElectroPheuria-backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

    # React SPA - all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
